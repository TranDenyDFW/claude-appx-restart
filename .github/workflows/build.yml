name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, build and package (windows-latest)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install pinned build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Self-check from source
        run: python claude_restart.py --self-check

      - name: Icon reproducibility (warn only)
        continue-on-error: true
        run: python tools/make_icon.py --check

      - name: Tag must match __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: python build.py --check-tag "${{ github.ref_name }}"

      # build.py smoke-tests both executables (--version and --self-check) before zipping.
      - name: Build, smoke-test and package
        run: python build.py --no-install --skip-tests --skip-icon

      - name: Show checksums
        run: Get-Content .\dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeRestart-win-x64
          if-no-files-found: error
          path: |
            dist/ClaudeRestart-*.zip
            dist/ClaudeRestart.exe
            dist/ClaudeRestart-quiet.exe
            dist/SHA256SUMS.txt

  release:
    name: Publish GitHub Release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: this job never executes repository code. It only publishes the
      # artifact that the read-only build job produced, so the write token is never
      # available to build scripts or tests.
      - uses: actions/download-artifact@v7
        with:
          name: ClaudeRestart-win-x64
          path: dist

      - name: Create or update the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zip=$(ls dist/ClaudeRestart-v*-win-x64.zip)
          # A rerun after a partial failure (for example a GitHub 5xx after the release
          # was already created) reuses the existing release and replaces its assets.
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets"
          else
            echo "Creating release $TAG"
            gh release create "$TAG" --verify-tag --generate-notes --title "ClaudeRestart $TAG"
          fi
          gh release upload "$TAG" --clobber \
            "$zip#ClaudeRestart $TAG (zip: both exes, launchers, docs)" \
            "dist/ClaudeRestart.exe#ClaudeRestart.exe (console)" \
            "dist/ClaudeRestart-quiet.exe#ClaudeRestart-quiet.exe (windowed twin used by the scheduled task)" \
            "dist/SHA256SUMS.txt#SHA256SUMS.txt"
          gh release view "$TAG" --json assets --jq '.assets[].name'
