name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, build and package (windows-latest)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install pinned build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Self-check from source
        run: python claude_restart.py --self-check

      - name: Icon reproducibility (warn only)
        continue-on-error: true
        run: python tools/make_icon.py --check

      - name: Tag must match __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: python build.py --check-tag "${{ github.ref_name }}"

      - name: Build executables and release zip
        run: python build.py --no-install --skip-tests --skip-icon

      - name: Smoke test the executables
        run: |
          .\dist\ClaudeRestart.exe --version
          .\dist\ClaudeRestart.exe --self-check
          $quiet = Start-Process -FilePath .\dist\ClaudeRestart-quiet.exe -ArgumentList '--self-check' -PassThru
          $quiet.WaitForExit()
          if ($quiet.ExitCode -ne 0) { throw "ClaudeRestart-quiet.exe exited with $($quiet.ExitCode)" }
          Get-Content .\dist\last-run.log
          Get-Content .\dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeRestart-win-x64
          path: |
            dist/ClaudeRestart-*.zip
            dist/ClaudeRestart.exe
            dist/ClaudeRestart-quiet.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-Item dist/ClaudeRestart-*.zip).FullName
          gh release create "${{ github.ref_name }}" --verify-tag --generate-notes --title "ClaudeRestart ${{ github.ref_name }}" `
            "$zip#ClaudeRestart ${{ github.ref_name }} (zip: both exes, launchers, docs)" `
            "dist/ClaudeRestart.exe#ClaudeRestart.exe (console)" `
            "dist/ClaudeRestart-quiet.exe#ClaudeRestart-quiet.exe (windowed twin used by the scheduled task)" `
            "dist/SHA256SUMS.txt#SHA256SUMS.txt"
